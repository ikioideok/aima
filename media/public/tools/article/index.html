<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AI記事生成ツール | AI Marketing</title>
    <style>
      html,body { height: 100%; margin: 0; }
      .wrap { min-height: 100%; display: flex; flex-direction: column; }
      header { padding: 12px 16px; font: 600 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Noto Sans JP", sans-serif; }
      .frame { flex: 1 1 auto; border: 0; width: 100%; height: calc(100vh - 48px); }
      .note { padding: 8px 16px; color: #555; font: 400 13px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Noto Sans JP", sans-serif; }
      @media (max-width: 640px){ .frame{ height: calc(100vh - 40px);} header{ padding:10px 12px;} }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>AI記事生成（ベータ）</header>
      <iframe class="frame" src="/media/tools/article/" title="AI記事生成ツール" loading="eager" referrerpolicy="no-referrer-when-downgrade"></iframe>
      <div class="note">表示されない場合はリロードしてください。管理トークン未設定時はボタンが無効になります。</div>
    </div>
  </body>
  </html>
