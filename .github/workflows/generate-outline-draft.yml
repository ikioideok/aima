name: Generate Outline Draft

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "LLM provider"
        required: true
        type: choice
        options: [openai, gemini]
        default: gemini
      model:
        description: "Model ID (任意)"
        required: false
        type: string
      keyword:
        description: "記事キーワード"
        required: true
        type: string
      category:
        description: "カテゴリ (例: SEO)"
        required: true
        type: string
      tone:
        description: "トーン"
        required: false
        type: string
        default: 実務的で明快
      audience:
        description: "想定読者"
        required: false
        type: string
        default: マーケ担当者・事業責任者
      titleOverride:
        description: "タイトル上書き（任意）"
        required: false
        type: string

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate outline JSON and save as draft
        env:
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
          KEYWORD: ${{ inputs.keyword }}
          CATEGORY: ${{ inputs.category }}
          TONE: ${{ inputs.tone }}
          AUDIENCE: ${{ inputs.audience }}
          TITLE_OVERRIDE: ${{ inputs.titleOverride }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_BASE: ${{ secrets.GEMINI_API_BASE }}
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const env = process.env
          const provider = (env.PROVIDER || 'gemini').toLowerCase()
          const model = env.MODEL || (provider === 'openai' ? 'gpt-4o-mini' : 'gemini-2.5-pro')
          const keyword = env.KEYWORD
          const category = env.CATEGORY || 'SEO'
          const tone = env.TONE || '実務的で明快'
          const audience = env.AUDIENCE || 'マーケ担当者・事業責任者'
          const titleOverride = env.TITLE_OVERRIDE || ''

          if (!keyword) throw new Error('keyword is required')

          function slugify(input) {
            try {
              return String(input || '')
                .toLowerCase()
                .normalize('NFKD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9\s-]/g, '')
                .trim()
                .replace(/[\s_-]+/g, '-')
                .replace(/^-+|-+$/g, '')
            } catch { return '' }
          }

          async function openaiChat({ system, user }) {
            const base = env.OPENAI_API_BASE || 'https://api.openai.com/v1'
            const url = base.replace(/\/$/, '') + '/chat/completions'
            const headers = { 'Authorization': `Bearer ${env.OPENAI_API_KEY}`, 'Content-Type': 'application/json' }
            const body = JSON.stringify({ model, messages: [ system ? { role: 'system', content: system } : null, { role: 'user', content: user } ].filter(Boolean), response_format: { type: 'json_object' } })
            const r = await fetch(url, { method: 'POST', headers, body })
            const text = await r.text().catch(()=> '')
            if (!r.ok) throw new Error(`OpenAI error ${r.status}: ${text}`)
            let data; try { data = JSON.parse(text) } catch {}
            let content = data?.choices?.[0]?.message?.content || '{}'
            const tryParse = (s)=>{ try { return JSON.parse(s) } catch { return null } }
            const strip = (s)=> s.replace(/^\s*```(?:json)?/i,'').replace(/```\s*$/,'').trim()
            return tryParse(content) || tryParse(strip(content)) || (()=>{ throw new Error('Invalid JSON') })()
          }

          async function geminiChat({ system, user }) {
            const base = env.GEMINI_API_BASE || 'https://generativelanguage.googleapis.com/v1beta'
            const url = base.replace(/\/$/, '') + `/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(env.GEMINI_API_KEY)}`
            const body = { contents: [{ role: 'user', parts: [{ text: user }] }], ...(system ? { systemInstruction: { role: 'system', parts: [{ text: system }] } } : {}), generationConfig: { responseMimeType: 'application/json' } }
            const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
            const text = await r.text().catch(()=> '')
            if (!r.ok) throw new Error(`Gemini error ${r.status}: ${text}`)
            let data; try { data = JSON.parse(text) } catch {}
            const parts = data?.candidates?.[0]?.content?.parts || []
            const joined = parts.map(p=>p?.text).filter(Boolean).join('\n').trim()
            const tryParse = (s)=>{ try { return JSON.parse(s) } catch { return null } }
            const strip = (s)=> s.replace(/^\s*```(?:json)?/i,'').replace(/```\s*$/,'').trim()
            return tryParse(joined) || tryParse(strip(joined)) || (()=>{ throw new Error('Invalid JSON') })()
          }

          async function llmOutline() {
            const system = 'あなたは日本語のコンテンツストラテジストです。AIMAの実務記事構成をMECEで設計してください。'
            const user = `前提\n- キーワード: ${keyword}\n- カテゴリ: ${category}\n- トーン: ${tone}\n- 想定読者: ${audience}\n\nJSONのみ出力: {"title":string,"slug":string,"h2":[{"title":string,"h3":string[]}]}\n禁止: 説明文やコードフェンス`
            if (provider === 'openai') return await openaiChat({ system, user })
            return await geminiChat({ system, user })
          }

          ;(async () => {
            const outline = await llmOutline()
            const title = titleOverride || String(outline?.title || keyword)
            const slug = slugify(outline?.slug || title) || slugify(keyword) || `post-${new Date().toISOString().slice(0,10)}`
            const draftDir = path.join(process.cwd(), 'media', 'drafts', slug)
            fs.mkdirSync(draftDir, { recursive: true })
            fs.writeFileSync(path.join(draftDir, 'outline.json'), JSON.stringify(outline, null, 2) + '\n')
            const meta = { provider, model, keyword, category, tone, audience, title }
            fs.writeFileSync(path.join(draftDir, 'meta.json'), JSON.stringify(meta, null, 2) + '\n')
            console.log('Draft saved at:', `media/drafts/${slug}/`)
          })().catch((e)=>{ console.error(e); process.exit(1) })
          NODE
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add media/drafts
          git commit -m "draft(outline): ${{ inputs.keyword }} (provider=${{ inputs.provider }})" || echo "No changes"
          git push

