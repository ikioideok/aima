name: Issue to Article

on:
  issues:
    types: [opened]

jobs:
  build-article-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse issue
        id: parse
        shell: node
        run: |
          const fs = require('fs');

          const title = process.env.ISSUE_TITLE || '';
          const body = (process.env.ISSUE_BODY || '').replace(/\r\n/g, '\n');
          const lines = body.split('\n');
          const category = (lines[0] || '').trim();
          const subtitle = (lines[1] || '').trim();
          const content = lines.slice(2).join('\n').trim();

          const date = new Date().toISOString().slice(0,10).replace(/-/g, '.');
          const id = title
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-+|-+$/g, '');

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `title=${title}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `category=${category}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `subtitle=${subtitle}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `content<<CONTENT\n${content}\nCONTENT\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `date=${date}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `id=${id}\n`);
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Update articles
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const dataPath = path.join(process.cwd(), 'data/articles.ts');
          const raw = fs.readFileSync(dataPath, 'utf-8');
          const match = raw.match(/export const articles: Article\[] = (.*);/s);
          if (!match) throw new Error('articles array not found');
          const jsonText = match[1];
          const articles = eval(jsonText); // trusted in CI
          const article = {
            id: process.env.ARTICLE_ID,
            title: process.env.ARTICLE_TITLE,
            subtitle: process.env.ARTICLE_SUBTITLE,
            date: process.env.ARTICLE_DATE,
            category: process.env.ARTICLE_CATEGORY,
            image: 'https://placehold.co/1200x630?text=' + encodeURIComponent(process.env.ARTICLE_TITLE),
            content: process.env.ARTICLE_CONTENT,
            excerpt: process.env.ARTICLE_SUBTITLE,
            displayType: 'LATEST',
          };
          articles.unshift(article);
          const tsContent = `import { Article } from '../types';\n\nexport const articles: Article[] = ${JSON.stringify(articles, null, 4)};\n`;
          fs.writeFileSync(dataPath, tsContent, 'utf-8');
          NODE
        env:
          ARTICLE_ID: ${{ steps.parse.outputs.id }}
          ARTICLE_TITLE: ${{ steps.parse.outputs.title }}
          ARTICLE_CATEGORY: ${{ steps.parse.outputs.category }}
          ARTICLE_SUBTITLE: ${{ steps.parse.outputs.subtitle }}
          ARTICLE_CONTENT: ${{ steps.parse.outputs.content }}
          ARTICLE_DATE: ${{ steps.parse.outputs.date }}

      - name: Build
        run: |
          npm run build
          cp public/.htaccess dist/.htaccess

      - name: Deploy via FTP (curl)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_TARGET: ${{ secrets.FTP_TARGET }}
        run: |
          set -e
          BASE="ftp://${FTP_SERVER}/${FTP_TARGET:-www/}"
          echo "Deploying to ${BASE}"
          find dist -type f -print0 | while IFS= read -r -d '' file; do
            remote_path="${file#dist/}"
            echo "Uploading ${remote_path}"
            curl --fail --silent --show-error \
              --ftp-create-dirs \
              --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
              -T "${file}" \
              "${BASE}${remote_path}"
          done

      - name: Commit article
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
          git add data/articles.ts
          git commit -m "Add article from issue: ${{ steps.parse.outputs.title }}" || echo "No changes to commit"
          git push origin main
