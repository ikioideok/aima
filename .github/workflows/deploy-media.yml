name: Deploy media to Sakura

on:
  push:
    branches: [ main ]
    paths:
      - 'media/**'
      - '!media/node_modules/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      SAKURA_HOST: ${{ secrets.SAKURA_HOST }}
      SAKURA_USER: ${{ secrets.SAKURA_USER }}
      SAKURA_PASSWORD: ${{ secrets.SAKURA_PASSWORD }}
      SAKURA_SSH_KEY: ${{ secrets.SAKURA_SSH_KEY }}
      SAKURA_REMOTE_DIR: ${{ secrets.SAKURA_REMOTE_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            media/package-lock.json

      - name: Build media site
        working-directory: media
        env:
          VITE_CMS_API_BASE: ${{ secrets.VITE_CMS_API_BASE }}
          VITE_ADMIN_TOKEN: ${{ secrets.VITE_ADMIN_TOKEN }}
        run: |
          npm ci
          npm run build
          npm run postbuild || true
          # 念のため成果物と疎通ファイルを用意
          mkdir -p dist/media
          echo "deployed OK $(date -u +'%Y-%m-%dT%H:%M:%SZ')" > dist/media/health.txt

      - name: Upload dist/media via SFTP
        if: ${{ env.SAKURA_HOST != '' && env.SAKURA_USER != '' && (env.SAKURA_PASSWORD != '' || env.SAKURA_SSH_KEY != '') && env.SAKURA_REMOTE_DIR != '' }}
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ env.SAKURA_HOST }}
          port: 22
          username: ${{ env.SAKURA_USER }}
          password: ${{ env.SAKURA_PASSWORD }}
          # 鍵認証に切り替えるときは下を有効化（↑passwordは空に）
          # ssh_private_key: ${{ env.SAKURA_SSH_KEY }}
          local_path: media/dist/media
          remote_path: ${{ env.SAKURA_REMOTE_DIR }}
          sftp_only: true
          sftpArgs: "-o StrictHostKeyChecking=no -o ConnectTimeout=10"

      - name: Smoke test
        run: |
          curl -sSf "http://violetsheep5.sakura.ne.jp/media/health.txt" >/dev/null
          echo "Smoke test OK"
