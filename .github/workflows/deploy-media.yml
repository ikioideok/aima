      - name: Guard remote path
        run: |
          case "${SAKURA_REMOTE_DIR}" in
            */www/media|*/www/media/) echo "OK: ${SAKURA_REMOTE_DIR}" ;;
            *) echo "NG: SAKURA_REMOTE_DIR must be .../www/media/ ; got '${SAKURA_REMOTE_DIR}'" && exit 1 ;;
          esac

      - name: Upload dist contents via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.SAKURA_HOST }}
          port: 22
          username: ${{ secrets.SAKURA_USER }}
          password: ${{ secrets.SAKURA_PASSWORD }}
          # 鍵認証を使う場合は上で password を空にして ssh_private_key を使う
          local_path: media/dist/          # ← distの“中身”をアップロード
          remote_path: ${{ secrets.SAKURA_REMOTE_DIR }}  # 例: /home/violetsheep5/www/media/
          sftp_only: true
          sftpArgs: "-o StrictHostKeyChecking=no -o ConnectTimeout=10"
