name: Deploy media to Sakura

on:
  push:
    branches: [ main ]
    paths:
      - "media/**"
      - "!media/node_modules/**"
  workflow_dispatch:

concurrency:
  group: deploy-media
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      SAKURA_HOST: ${{ secrets.SAKURA_HOST }}
      SAKURA_USER: ${{ secrets.SAKURA_USER }}
      SAKURA_PASSWORD: ${{ secrets.SAKURA_PASSWORD }}
      SAKURA_REMOTE_DIR: ${{ secrets.SAKURA_REMOTE_DIR }}  # 例: /home/violetsheep5/www/media/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: media/package-lock.json

      - name: Build media site (prefix=media)
        env:
          VITE_CMS_API_BASE: ${{ secrets.VITE_CMS_API_BASE }}
          VITE_ADMIN_TOKEN: ${{ secrets.VITE_ADMIN_TOKEN }}
        run: |
          npm ci --prefix media
          npm run build --prefix media
          npm run postbuild --prefix media || true
          mkdir -p dist/media
          echo "deployed OK $(date -u +'%Y-%m-%dT%H:%M:%SZ')" > dist/media/health.txt
          # ensure jinzai health exists even if prerender skipped for some reason
          mkdir -p dist/jinzai
          echo "deployed OK $(date -u +'%Y-%m-%dT%H:%M:%SZ')" > dist/jinzai/health.txt
          echo "---- local dist/media listing ----"
          find dist/media -maxdepth 2 -type f -printf "%p\n" | sort

      - name: Guard remote path (/www/media)
        run: |
          case "${SAKURA_REMOTE_DIR}" in
            */www/media|*/www/media/) echo "OK: ${SAKURA_REMOTE_DIR}" ;;
            *) echo "NG: SAKURA_REMOTE_DIR must be .../www/media/ ; got '${SAKURA_REMOTE_DIR}'" && exit 1 ;;
          esac

      - name: Deploy via lftp mirror (dist/media → /www/media)
        env:
          LFTP_PASSWORD: ${{ secrets.SAKURA_PASSWORD }}
        run: |
          sudo apt-get update -y >/dev/null && sudo apt-get install -y lftp >/dev/null
          echo "Mirroring ./dist/media/ -> ${SAKURA_REMOTE_DIR}"
          # dist/media の「中身だけ」を /www/media/ 直下へ配置
          lftp -u "${SAKURA_USER},${LFTP_PASSWORD}" sftp://"${SAKURA_HOST}" -e \
            "set sftp:auto-confirm yes; mkdir -p ${SAKURA_REMOTE_DIR}; mirror -R --only-newer --parallel=2 ./dist/media/ ${SAKURA_REMOTE_DIR}; bye"
          echo "---- remote /www/media listing ----"
          lftp -u "${SAKURA_USER},${LFTP_PASSWORD}" sftp://"${SAKURA_HOST}" -e \
            "set sftp:auto-confirm yes; cls -l ${SAKURA_REMOTE_DIR}; bye"

      - name: Deploy jinzai (dist/jinzai → /www/jinzai)
        if: ${{ always() }}
        env:
          LFTP_PASSWORD: ${{ secrets.SAKURA_PASSWORD }}
        run: |
          # /www/ ルートを media のリモート指定から導出
          ROOT_REMOTE_DIR="${SAKURA_REMOTE_DIR%/media/}"
          # normalize to ensure a single trailing slash
          ROOT_REMOTE_DIR="${ROOT_REMOTE_DIR%/}/"
          JINZAI_REMOTE_DIR="${ROOT_REMOTE_DIR}jinzai/"
          echo "Derived ROOT_REMOTE_DIR=${ROOT_REMOTE_DIR}"
          echo "Deploy JINZAI_REMOTE_DIR=${JINZAI_REMOTE_DIR}"
          if [ -d dist/jinzai ]; then
            sudo apt-get update -y >/dev/null && sudo apt-get install -y lftp >/dev/null
            echo "Mirroring ./dist/jinzai/ -> ${JINZAI_REMOTE_DIR}"
            lftp -u "${SAKURA_USER},${LFTP_PASSWORD}" sftp://"${SAKURA_HOST}" -e \
              "set sftp:auto-confirm yes; mkdir -p ${JINZAI_REMOTE_DIR}; mirror -R --only-newer --parallel=2 ./dist/jinzai/ ${JINZAI_REMOTE_DIR}; bye"
            echo "---- remote /www/jinzai listing ----"
            lftp -u "${SAKURA_USER},${LFTP_PASSWORD}" sftp://"${SAKURA_HOST}" -e \
              "set sftp:auto-confirm yes; cls -l ${JINZAI_REMOTE_DIR}; bye"
          else
            echo "dist/jinzai not found. Skipping."
          fi

      - name: Verify jinzai (HTTP)
        env:
          LFTP_PASSWORD: ${{ secrets.SAKURA_PASSWORD }}
        run: |
          ROOT_REMOTE_DIR="${SAKURA_REMOTE_DIR%/media/}"
          echo "Waiting for /jinzai/ publish (up to ~30s)..."
          for i in {1..6}; do
            code=$(curl -s -o /dev/null -m 10 -w "%{http_code}" "https://violetsheep5.sakura.ne.jp/jinzai/")
            echo "try $i: $code"
            [ "$code" = "200" ] && echo "OK" && exit 0
            sleep 5
          done
          echo "NG: /jinzai/ still 404"
          exit 1

      - name: Verify (SFTP & HTTP)
        env:
          LFTP_PASSWORD: ${{ secrets.SAKURA_PASSWORD }}
        run: |
          # SFTPで /www/media/health.txt を取得して実在確認
          lftp -u "${SAKURA_USER},${LFTP_PASSWORD}" sftp://"${SAKURA_HOST}" -e \
            "set sftp:auto-confirm yes; get ${SAKURA_REMOTE_DIR}/health.txt -o _health.txt; bye"
          echo "---- remote health.txt ----"
          cat _health.txt
          # HTTP確認（プレビュー用ドメインでOK）
          echo "Waiting for publish (up to ~30s)..."
          for i in {1..6}; do
            code=$(curl -s -o /dev/null -m 10 -w "%{http_code}" "https://violetsheep5.sakura.ne.jp/media/health.txt")
            echo "try $i: $code"
            [ "$code" = "200" ] && echo "OK" && exit 0
            sleep 5
          done
          echo "NG: still 404"
          exit 1
