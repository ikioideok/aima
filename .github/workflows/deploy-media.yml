name: Deploy media to Sakura

on:
  push:
    branches: [ main ]
    paths:
      - "media/**"
      - "!media/node_modules/**"
  workflow_dispatch:

concurrency:
  group: deploy-media
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      SAKURA_HOST: ${{ secrets.SAKURA_HOST }}
      SAKURA_USER: ${{ secrets.SAKURA_USER }}
      SAKURA_PASSWORD: ${{ secrets.SAKURA_PASSWORD }}
      SAKURA_SSH_KEY: ${{ secrets.SAKURA_SSH_KEY }}
      SAKURA_REMOTE_DIR: ${{ secrets.SAKURA_REMOTE_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: media/package-lock.json

      - name: Build media site
        working-directory: media
        env:
          VITE_CMS_API_BASE: ${{ secrets.VITE_CMS_API_BASE }}
          VITE_ADMIN_TOKEN: ${{ secrets.VITE_ADMIN_TOKEN }}
        run: |
          npm ci
          npm run build
          npm run postbuild || true
          # 疎通ファイルは dist 直下に置く（= /media/health.txt）
          echo "deployed OK $(date -u +'%Y-%m-%dT%H:%M:%SZ')" > dist/health.txt
          echo "---- local dist preview ----"
          find dist -maxdepth 2 -type f -printf "%p\n" | sort

      - name: Upload dist → /www/media/
        if: ${{ env.SAKURA_HOST != '' && env.SAKURA_USER != '' && (env.SAKURA_PASSWORD != '' || env.SAKURA_SSH_KEY != '') && env.SAKURA_REMOTE_DIR != '' }}
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ env.SAKURA_HOST }}
          port: 22
          username: ${{ env.SAKURA_USER }}
          password: ${{ env.SAKURA_PASSWORD }}
          # 鍵認証に切り替える場合は上を空にしてこちらを有効化
          # ssh_private_key: ${{ env.SAKURA_SSH_KEY }}
          local_path: media/dist/
          remote_path: ${{ env.SAKURA_REMOTE_DIR }}
          sftp_only: true
          sftpArgs: "-o StrictHostKeyChecking=no -o ConnectTimeout=10"

      - name: Smoke test
        run: |
          echo "Waiting for publish (up to ~30s)..."
          for i in {1..6}; do
            if curl -fsS -m 10 "https://violetsheep5.sakura.ne.jp/media/health.txt" > /dev/null; then
              echo "Smoke test OK"
              exit 0
            fi
            echo "Not ready yet (try $i/6). Sleeping 5s..."
            sleep 5
          done
          echo "Smoke test failed: /media/health.txt not found after retries"
          exit 1
