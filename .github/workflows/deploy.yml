name: Deploy to Sakura FTP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: |
          npm run build
          cp public/.htaccess dist/.htaccess

      - name: Deploy via FTP (curl)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_TARGET: ${{ secrets.FTP_TARGET }}
        run: |
          set -e
          BASE="ftp://${FTP_SERVER}/${FTP_TARGET:-www/}"
          echo "Deploying to ${BASE}"
          find dist -type f -print0 | while IFS= read -r -d '' file; do
            remote_path="${file#dist/}"
            echo "Uploading ${remote_path}"
            curl --fail --silent --show-error \
              --ftp-create-dirs \
              --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
              -T "${file}" \
              "${BASE}${remote_path}"
          done
