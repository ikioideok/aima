name: Deploy to Sakura (manual)

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-manual-sakura
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SAKURA_HOST: ${{ secrets.SAKURA_HOST }}
      SAKURA_USER: ${{ secrets.SAKURA_USER }}
      SAKURA_PASSWORD: ${{ secrets.SAKURA_PASSWORD }}
      SAKURA_REMOTE_DIR: ${{ secrets.SAKURA_REMOTE_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build media with prerender
        env:
          VITE_CMS_API_BASE: ${{ secrets.VITE_CMS_API_BASE }}
          VITE_ADMIN_TOKEN: ${{ secrets.VITE_ADMIN_TOKEN }}
        run: |
          npm ci --prefix media
          npm run build --prefix media
          npm run postbuild --prefix media || true
          mkdir -p dist/media
          echo "built: $(date -u +'%FT%TZ')" > dist/media/health.txt
          mkdir -p dist/jinzai
          echo "built: $(date -u +'%FT%TZ')" > dist/jinzai/health.txt

      - name: Deploy media (/media)
        env:
          LFTP_PASSWORD: ${{ secrets.SAKURA_PASSWORD }}
        run: |
          sudo apt-get update -y >/dev/null && sudo apt-get install -y lftp >/dev/null
          echo "Mirroring ./dist/media -> ${SAKURA_REMOTE_DIR}"
          lftp -u "${SAKURA_USER},${LFTP_PASSWORD}" sftp://"${SAKURA_HOST}" -e \
            "set sftp:auto-confirm yes; mkdir -p ${SAKURA_REMOTE_DIR}; mirror -R --parallel=2 --ignore-time --overwrite ./dist/media/ ${SAKURA_REMOTE_DIR}; bye"

      - name: Update media .htaccess (exclude /jinzai from SPA fallback)
        env:
          LFTP_PASSWORD: ${{ secrets.SAKURA_PASSWORD }}
        run: |
          echo "Upload media/.htaccess to ${SAKURA_REMOTE_DIR}"
          sudo apt-get update -y >/dev/null && sudo apt-get install -y lftp >/dev/null
          cat > _media_htaccess <<'HT'
          Options -MultiViews
          DirectoryIndex index.html
          RewriteEngine On
          # Explicitly serve /jinzai/ with its own index
          RewriteRule ^jinzai/?$ jinzai/index.html [L]
          # Serve existing files/directories as-is
          RewriteCond %{REQUEST_FILENAME} -f [OR]
          RewriteCond %{REQUEST_FILENAME} -d
          RewriteRule ^ - [L]
          # Do not rewrite jinzai tenant; handled by its own index/.htaccess
          RewriteRule ^jinzai/ - [L]
          # SPA fallback for media app
          RewriteRule . index.html [L]
          HT
          lftp -u "${SAKURA_USER},${LFTP_PASSWORD}" sftp://"${SAKURA_HOST}" -e \
            "set sftp:auto-confirm yes; cd ${SAKURA_REMOTE_DIR}; rm -f .htaccess; put _media_htaccess; mv _media_htaccess .htaccess; bye"

      - name: Update root .htaccess (ensure static served)
        env:
          LFTP_PASSWORD: ${{ secrets.SAKURA_PASSWORD }}
        run: |
          ROOT_REMOTE_DIR="${SAKURA_REMOTE_DIR%/}"
          case "$ROOT_REMOTE_DIR" in
            */media) ROOT_REMOTE_DIR="${ROOT_REMOTE_DIR%/media}" ;;
          esac
          ROOT_REMOTE_DIR="${ROOT_REMOTE_DIR%/}/"
          ALT_ROOT_REMOTE_DIR="$ROOT_REMOTE_DIR"
          case "$ALT_ROOT_REMOTE_DIR" in
            */public_html/) ALT_ROOT_REMOTE_DIR="${ALT_ROOT_REMOTE_DIR%public_html/}" ;;
            */www/) ALT_ROOT_REMOTE_DIR="${ALT_ROOT_REMOTE_DIR}public_html/" ;;
          esac
          echo "ROOT_REMOTE_DIR=${ROOT_REMOTE_DIR} ALT_ROOT_REMOTE_DIR=${ALT_ROOT_REMOTE_DIR}"
          sudo apt-get update -y >/dev/null && sudo apt-get install -y lftp >/dev/null
          cat > _root_htaccess <<'HT'
          Options -MultiViews
          DirectoryIndex index.html
          # No global rewrites here; sub-apps manage their own.
          HT
          lftp -u "${SAKURA_USER},${LFTP_PASSWORD}" sftp://"${SAKURA_HOST}" -e \
            "set sftp:auto-confirm yes; cd ${ROOT_REMOTE_DIR}; rm -f .htaccess; put _root_htaccess; mv _root_htaccess .htaccess; cd ${ALT_ROOT_REMOTE_DIR}; rm -f .htaccess; put _root_htaccess; mv _root_htaccess .htaccess; bye"

      - name: Deploy jinzai (/jinzai)
        if: ${{ false }}
        env:
          LFTP_PASSWORD: ${{ secrets.SAKURA_PASSWORD }}
        run: |
          # Derive ROOT_REMOTE_DIR robustly from SAKURA_REMOTE_DIR (handles /media and /media/)
          echo "SAKURA_REMOTE_DIR=${SAKURA_REMOTE_DIR}"
          ROOT_REMOTE_DIR="${SAKURA_REMOTE_DIR%/}"
          case "$ROOT_REMOTE_DIR" in
            */media) ROOT_REMOTE_DIR="${ROOT_REMOTE_DIR%/media}" ;;
          esac
          ROOT_REMOTE_DIR="${ROOT_REMOTE_DIR%/}/"
          JINZAI_REMOTE_DIR="${ROOT_REMOTE_DIR}jinzai/"
          MEDIA_JINZAI_DIR="${SAKURA_REMOTE_DIR%/}/jinzai/"
          # Also compute an alternate root by toggling '/public_html' segment to handle different docroots
          ALT_ROOT_REMOTE_DIR="$ROOT_REMOTE_DIR"
          case "$ALT_ROOT_REMOTE_DIR" in
            */public_html/) ALT_ROOT_REMOTE_DIR="${ALT_ROOT_REMOTE_DIR%public_html/}" ;;
            */www/) ALT_ROOT_REMOTE_DIR="${ALT_ROOT_REMOTE_DIR}public_html/" ;;
          esac
          ALT_JINZAI_REMOTE_DIR="${ALT_ROOT_REMOTE_DIR}jinzai/"
          echo "Derived ROOT_REMOTE_DIR=${ROOT_REMOTE_DIR}"
          echo "Deploy JINZAI_REMOTE_DIR=${JINZAI_REMOTE_DIR}"
          echo "MEDIA_JINZAI_DIR=${MEDIA_JINZAI_DIR}"
          echo "ALT_ROOT_REMOTE_DIR=${ALT_ROOT_REMOTE_DIR}"
          echo "Deploy ALT_JINZAI_REMOTE_DIR=${ALT_JINZAI_REMOTE_DIR}"

      - name: Deploy jinzai (fixed)
        env:
          LFTP_PASSWORD: ${{ secrets.SAKURA_PASSWORD }}
        run: |
          echo "SAKURA_REMOTE_DIR=${SAKURA_REMOTE_DIR}"
          ROOT_REMOTE_DIR="${SAKURA_REMOTE_DIR%/}"
          case "$ROOT_REMOTE_DIR" in
            */media) ROOT_REMOTE_DIR="${ROOT_REMOTE_DIR%/media}" ;;
          esac
          ROOT_REMOTE_DIR="${ROOT_REMOTE_DIR%/}/"
          JINZAI_REMOTE_DIR="${ROOT_REMOTE_DIR}jinzai/"
          MEDIA_JINZAI_DIR="${SAKURA_REMOTE_DIR%/}/jinzai/"
          ALT_ROOT_REMOTE_DIR="$ROOT_REMOTE_DIR"
          case "$ALT_ROOT_REMOTE_DIR" in
            */public_html/) ALT_ROOT_REMOTE_DIR="${ALT_ROOT_REMOTE_DIR%public_html/}" ;;
            */www/) ALT_ROOT_REMOTE_DIR="${ALT_ROOT_REMOTE_DIR}public_html/" ;;
          esac
          ALT_JINZAI_REMOTE_DIR="${ALT_ROOT_REMOTE_DIR}jinzai/"
          echo "Derived ROOT_REMOTE_DIR=${ROOT_REMOTE_DIR}"
          echo "Deploy JINZAI_REMOTE_DIR=${JINZAI_REMOTE_DIR}"
          echo "MEDIA_JINZAI_DIR=${MEDIA_JINZAI_DIR}"
          echo "ALT_ROOT_REMOTE_DIR=${ALT_ROOT_REMOTE_DIR}"
          echo "Deploy ALT_JINZAI_REMOTE_DIR=${ALT_JINZAI_REMOTE_DIR}"
          sudo apt-get update -y >/dev/null && sudo apt-get install -y lftp >/dev/null
          cat > _lftp_jinzai <<EOF
          open -u "${SAKURA_USER}","${LFTP_PASSWORD}" sftp://"${SAKURA_HOST}"
          set sftp:auto-confirm yes
          mkdir -p ${JINZAI_REMOTE_DIR}
          mirror -R --parallel=2 --ignore-time --overwrite ./dist/jinzai/ ${JINZAI_REMOTE_DIR}
          mkdir -p ${ALT_JINZAI_REMOTE_DIR}
          mirror -R --parallel=2 --ignore-time --overwrite ./dist/jinzai/ ${ALT_JINZAI_REMOTE_DIR}
          mkdir -p ${MEDIA_JINZAI_DIR}
          mirror -R --parallel=2 --ignore-time --overwrite ./dist/jinzai/ ${MEDIA_JINZAI_DIR}
          cls -l ${JINZAI_REMOTE_DIR}
          cls -l ${ALT_JINZAI_REMOTE_DIR}
          cls -l ${MEDIA_JINZAI_DIR}
          bye
          EOF
          lftp -f _lftp_jinzai

      - name: Update root .htaccess (ensure /jinzai not overridden)
        env:
          LFTP_PASSWORD: ${{ secrets.SAKURA_PASSWORD }}
        run: |
          # Same robust derivation as above
          ROOT_REMOTE_DIR="${SAKURA_REMOTE_DIR%/}"
          case "$ROOT_REMOTE_DIR" in
            */media) ROOT_REMOTE_DIR="${ROOT_REMOTE_DIR%/media}" ;;
          esac
          ROOT_REMOTE_DIR="${ROOT_REMOTE_DIR%/}/"
          # Also compute alternate root as above
          ALT_ROOT_REMOTE_DIR="$ROOT_REMOTE_DIR"
          case "$ALT_ROOT_REMOTE_DIR" in
            */public_html/) ALT_ROOT_REMOTE_DIR="${ALT_ROOT_REMOTE_DIR%public_html/}" ;;
            */www/) ALT_ROOT_REMOTE_DIR="${ALT_ROOT_REMOTE_DIR}public_html/" ;;
          esac
          echo "Upload .htaccess to ${ROOT_REMOTE_DIR} and ALT ${ALT_ROOT_REMOTE_DIR}"
          sudo apt-get update -y >/dev/null && sudo apt-get install -y lftp >/dev/null
          cat > _root_htaccess <<'HT'
          Options -MultiViews
          # Routing of sub-apps is handled by their own .htaccess (e.g., /media/, /jinzai/)
          HT
          lftp -u "${SAKURA_USER},${LFTP_PASSWORD}" sftp://"${SAKURA_HOST}" -e \
            "set sftp:auto-confirm yes; cd ${ROOT_REMOTE_DIR}; rm -f .htaccess; put _root_htaccess; mv _root_htaccess .htaccess; cd ${ALT_ROOT_REMOTE_DIR}; rm -f .htaccess; put _root_htaccess; mv _root_htaccess .htaccess; bye"

      - name: Deploy /tools static pages (root)
        env:
          LFTP_PASSWORD: ${{ secrets.SAKURA_PASSWORD }}
        run: |
          ROOT_REMOTE_DIR="${SAKURA_REMOTE_DIR%/}"
          case "$ROOT_REMOTE_DIR" in
            */media) ROOT_REMOTE_DIR="${ROOT_REMOTE_DIR%/media}" ;;
          esac
          ROOT_REMOTE_DIR="${ROOT_REMOTE_DIR%/}/"
          ALT_ROOT_REMOTE_DIR="$ROOT_REMOTE_DIR"
          case "$ALT_ROOT_REMOTE_DIR" in
            */public_html/) ALT_ROOT_REMOTE_DIR="${ALT_ROOT_REMOTE_DIR%public_html/}" ;;
            */www/) ALT_ROOT_REMOTE_DIR="${ALT_ROOT_REMOTE_DIR}public_html/" ;;
          esac
          echo "Mirror ./public/tools -> ${ROOT_REMOTE_DIR}tools/ and ALT ${ALT_ROOT_REMOTE_DIR}tools/"
          sudo apt-get update -y >/dev/null && sudo apt-get install -y lftp >/dev/null
          lftp -u "${SAKURA_USER},${LFTP_PASSWORD}" sftp://"${SAKURA_HOST}" -e \
            "set sftp:auto-confirm yes; mkdir -p ${ROOT_REMOTE_DIR}tools/; mirror -R --parallel=2 --ignore-time --overwrite ./public/tools/ ${ROOT_REMOTE_DIR}tools/; mkdir -p ${ALT_ROOT_REMOTE_DIR}tools/; mirror -R --parallel=2 --ignore-time --overwrite ./public/tools/ ${ALT_ROOT_REMOTE_DIR}tools/; bye"

      - name: Deploy /api PHP endpoints (root)
        env:
          LFTP_PASSWORD: ${{ secrets.SAKURA_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ROOT_REMOTE_DIR="${SAKURA_REMOTE_DIR%/}"
          case "$ROOT_REMOTE_DIR" in
            */media) ROOT_REMOTE_DIR="${ROOT_REMOTE_DIR%/media}" ;;
          esac
          ROOT_REMOTE_DIR="${ROOT_REMOTE_DIR%/}/"
          mkdir -p api
          # search-top.php: Google検索上位10件＋見出し抽出
          cat > api/search-top.php <<'PHP'
          <?php
          header('Content-Type: application/json; charset=utf-8');
          header('Access-Control-Allow-Origin: *');
          header('Access-Control-Allow-Methods: POST, OPTIONS');
          header('Access-Control-Allow-Headers: Content-Type');
          if ($_SERVER['REQUEST_METHOD'] === 'OPTIONS') { http_response_code(204); exit; }
          if (isset($_GET['ping'])) { echo json_encode(['ok'=>true]); exit; }
          $raw = file_get_contents('php://input');
          $ct = isset($_SERVER['CONTENT_TYPE']) ? strtolower($_SERVER['CONTENT_TYPE']) : '';
          if ($_SERVER['REQUEST_METHOD'] === 'GET') { $input = $_GET; } else if (strpos($ct,'application/json') !== false) { $input = json_decode($raw, true); } else { $input = $_POST; if (!$input && $raw) { parse_str($raw, $input); } }
          $keyword = isset($input['keyword']) ? trim($input['keyword']) : '';
          if (!$keyword) { http_response_code(400); echo json_encode(['error'=>'keyword required']); exit; }
          $q = urlencode($keyword);
          function curl_get($u){ $ch = curl_init($u); curl_setopt_array($ch,[CURLOPT_RETURNTRANSFER=>true,CURLOPT_FOLLOWLOCATION=>true,CURLOPT_CONNECTTIMEOUT=>8,CURLOPT_TIMEOUT=>20,CURLOPT_HTTPHEADER=>['Accept-Language: ja-JP,ja;q=0.9,en-US;q=0.8,en;q=0.7','Cache-Control: no-cache','Pragma: no-cache','Cookie: CONSENT=YES+','User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36']]); $res=curl_exec($ch); curl_close($ch); return $res?:''; }
          $candidates = [
            "https://www.google.com/search?hl=ja&gl=jp&pws=0&nfpr=1&num=20&q={$q}",
            "https://www.google.co.jp/search?hl=ja&gl=jp&pws=0&nfpr=1&num=20&q={$q}",
            "https://www.google.com/search?hl=ja&gl=jp&pws=0&nfpr=1&num=20&client=ms-android-google&q={$q}"
          ];
          $html = '';
          foreach ($candidates as $gu) { $html = curl_get($gu); if ($html) break; }
          $results = [];
          $debugInfo = ['google_added'=>0,'bing_added'=>0];
          if (!function_exists('extract_tags')) {
            function extract_tags($tx,$tag,$limit){ $out=[]; $re = '/<'.$tag.'[^>]*>([\\s\\S]*?)<\\/'.$tag.'>/i'; if (preg_match_all($re,$tx,$ms)){ foreach($ms[1] as $s){ $t = trim(preg_replace('/<[^>]+>/', ' ', $s)); if ($t!=='') $out[]=$t; if (count($out)>=$limit) break; } } return $out; }
          }
          $normalize = function($raw){
            $raw = trim(htmlspecialchars_decode($raw, ENT_QUOTES));
            if ($raw === '') return '';
            if ($raw[0] === '/') {
              $raw = 'https://www.google.com'.$raw;
            }
            if (stripos($raw, 'http') !== 0) return '';
            $parts = @parse_url($raw);
            if ($parts && isset($parts['host']) && preg_match('/google\./i', $parts['host']) && isset($parts['path']) && $parts['path'] === '/url'){
              $query = isset($parts['query']) ? $parts['query'] : '';
              if ($query){
                parse_str($query, $qs);
                foreach (['q','url'] as $key){
                  if (!empty($qs[$key]) && stripos($qs[$key], 'http') === 0) return $qs[$key];
                }
              }
            }
            return $raw;
          };
          $seen = [];
          $add = function($href) use (&$seen, &$results, $normalize){
            $u = $normalize($href);
            if (!$u || stripos($u,'http')!==0) return;
            $host = @parse_url($u, PHP_URL_HOST);
            if ($host && preg_match('/(google|gstatic)\./i',$host)) return;
            if (in_array($u,$seen,true)) return; $seen[] = $u;
            $tx = curl_get($u);
            $title = '';
            if (preg_match('/<title[^>]*>([\\s\\S]*?)<\\/title>/i', $tx, $mm)){
              $title = trim(preg_replace('/<[^>]+>/', ' ', $mm[1]));
            }
            $results[] = ['url'=>$u,'title'=>$title,'headings'=>['h1'=>extract_tags($tx,'h1',10),'h2'=>extract_tags($tx,'h2',30),'h3'=>extract_tags($tx,'h3',30),'h4'=>extract_tags($tx,'h4',20)]];
          };
          if ($html) {
            if (preg_match_all('/<a[^>]+href="([^"#]+)"/i', $html, $m)){
              foreach($m[1] as $link){ $add($link); if (count($results)>=20) break; }
            }
            if (count($results) < 20 && preg_match_all('/data-href="(https?:[^"#]+)"/i', $html, $m3)){
              foreach($m3[1] as $link){ $add($link); if (count($results)>=20) break; }
            }
          }
          $debugInfo['google_added'] = count($results);
          if (count($results) < 5) {
            $bing = curl_get("https://www.bing.com/search?q={$q}&setlang=ja&cc=JP&format=rss");
            if ($bing) {
              $xml = @simplexml_load_string($bing);
              if ($xml && isset($xml->channel) && isset($xml->channel->item)) {
                foreach ($xml->channel->item as $item) {
                  $link = isset($item->link) ? trim((string)$item->link) : '';
                  if ($link === '') continue;
                  $add($link);
                  if (count($results) >= 20) break;
                }
              }
              $debugInfo['bing_added'] = max(0, count($results) - $debugInfo['google_added']);
            }
          }
          if (count($results) > 10) { $results = array_slice($results,0,10); }
          if ((isset($_GET['debug']) && $_GET['debug']) || (isset($input['debug']) && $input['debug'])) {
            $m1 = 0; if (preg_match_all('/<a[^>]+href="\\/url\\?q=([^"&]+)[^"]*"/i', $html, $mm1)) { $m1 = count($mm1[1]); }
            $m2 = 0; if (preg_match_all('/<a[^>]+href=\"(https?:[^\"]+)\"/i', $html, $mm2)) { $m2 = count($mm2[1]); }
            $m3 = 0; if (preg_match_all('/data-href=\"(https?:[^\"]+)\"/i', $html, $mm3)) { $m3 = count($mm3[1]); }
            $blocked = (bool)preg_match('/(unusual traffic|enable javascript|consent)/i', $html);
            echo json_encode(['ok'=>true,'results'=>$results,'debug'=>['html_len'=>strlen($html),'m1'=>$m1,'m2'=>$m2,'m3'=>$m3,'blocked'=>$blocked,'google_added'=>$debugInfo['google_added'],'bing_added'=>$debugInfo['bing_added']]], JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);
          } else {
            echo json_encode(['ok'=>true,'results'=>$results], JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);
          }
          PHP
          # extract-headings.php: 1 URLから見出し抽出
          cat > api/extract-headings.php <<'PHP'
          <?php
          header('Content-Type: application/json; charset=utf-8');
          header('Access-Control-Allow-Origin: *');
          header('Access-Control-Allow-Methods: GET, POST, OPTIONS');
          header('Access-Control-Allow-Headers: Content-Type');
          if ($_SERVER['REQUEST_METHOD'] === 'OPTIONS') { http_response_code(204); exit; }
          if (isset($_GET['ping'])) { echo json_encode(['ok'=>true]); exit; }
          $raw = file_get_contents('php://input');
          $ct = isset($_SERVER['CONTENT_TYPE']) ? strtolower($_SERVER['CONTENT_TYPE']) : '';
          if ($_SERVER['REQUEST_METHOD'] === 'GET') { $input = $_GET; } else if (strpos($ct,'application/json') !== false) { $input = json_decode($raw, true); } else { $input = $_POST; if (!$input && $raw) { parse_str($raw, $input); } }
          $u = isset($input['url']) ? trim($input['url']) : '';
          if (!$u || strpos($u,'http')!==0) { http_response_code(400); echo json_encode(['error'=>'valid url required']); exit; }
          function curl_get($u){ $ch = curl_init($u); curl_setopt_array($ch,[CURLOPT_RETURNTRANSFER=>true,CURLOPT_FOLLOWLOCATION=>true,CURLOPT_CONNECTTIMEOUT=>8,CURLOPT_TIMEOUT=>20,CURLOPT_HTTPHEADER=>['Accept-Language: ja-JP,ja;q=0.9,en-US;q=0.8,en;q=0.7','Cache-Control: no-cache','Pragma: no-cache','User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36']]); $res=curl_exec($ch); curl_close($ch); return $res?:''; }
          $tx = curl_get($u);
          $title=''; if (preg_match('/<title[^>]*>([\s\S]*?)<\/title>/i', $tx, $mm)){ $title = trim(preg_replace('/<[^>]+>/', ' ', $mm[1])); }
          function extract_tags($tx,$tag,$limit){ $out=[]; $re = '/<'.$tag.'[^>]*>([\s\S]*?)<\/'.$tag.'>/i'; if (preg_match_all($re,$tx,$ms)){ foreach($ms[1] as $s){ $t = trim(preg_replace('/<[^>]+>/', ' ', $s)); if ($t!=='') $out[]=$t; if (count($out)>=$limit) break; } } return $out; }
          echo json_encode(['ok'=>true,'result'=>['url'=>$u,'title'=>$title,'headings'=>['h1'=>extract_tags($tx,'h1',10),'h2'=>extract_tags($tx,'h2',30),'h3'=>extract_tags($tx,'h3',30),'h4'=>extract_tags($tx,'h4',20)]]], JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);
          PHP
          cat > api/generate-outline.php <<'PHP'
          <?php
          header('Content-Type: application/json; charset=utf-8');
          header('Access-Control-Allow-Origin: *');
          header('Access-Control-Allow-Methods: POST, OPTIONS');
          header('Access-Control-Allow-Headers: Content-Type');
          if ($_SERVER['REQUEST_METHOD'] === 'OPTIONS') { http_response_code(204); exit; }
          if (isset($_GET['ping'])) { echo json_encode(['ok'=>true]); exit; }
          // Read JSON or form-urlencoded
          $raw = file_get_contents('php://input');
          $ct = isset($_SERVER['CONTENT_TYPE']) ? strtolower($_SERVER['CONTENT_TYPE']) : '';
          if (strpos($ct,'application/json') !== false) {
            $input = json_decode($raw, true);
          } else {
            $input = $_POST;
            // Fallback: parse raw if POST is empty
            if (!$input && $raw) { parse_str($raw, $input); }
          }
          $provider = isset($input['provider']) ? $input['provider'] : 'openai';
          $model = isset($input['model']) ? $input['model'] : ($provider==='gemini'?'gemini-2.5-pro':'gpt-5');
          $keyword = isset($input['keyword']) ? $input['keyword'] : '';
          $category = isset($input['category']) ? $input['category'] : '';
          $tone = isset($input['tone']) ? $input['tone'] : 'です・ます調で、実務的に明快';
          $aud = isset($input['target_audience']) ? $input['target_audience'] : 'マーケ担当者';
          $wc = isset($input['word_count_target']) ? intval($input['word_count_target']) : 1800;
          if(!$keyword){ http_response_code(400); echo json_encode(['error'=>'keyword required']); exit; }
          function slugify($s){ $s=mb_strtolower($s,'UTF-8'); $s=iconv('UTF-8','ASCII//TRANSLIT//IGNORE',$s); $s=preg_replace('/[^a-z0-9\s-]/','',$s); $s=trim($s); $s=preg_replace('/[\s_-]+/','-',$s); $s=preg_replace('/^-+|-+$/','',$s); return $s ?: 'article'; }
          $system = 'あなたは日本語のコンテンツストラテジストです。MECEで実務的な見出し構成をJSONだけで返します。';
          $sources = isset($input['sources']) ? (is_array($input['sources']) ? $input['sources'] : json_decode($input['sources'], true)) : [];
          $ref = '';
          if (is_array($sources) && count($sources)>0) {
            $parts = [];
            $i = 1;
            foreach ($sources as $s) {
              if ($i>10) break; $i++;
              $t = isset($s['title']) ? $s['title'] : '';
              $u = isset($s['url']) ? $s['url'] : '';
              $h2 = isset($s['headings']['h2']) && is_array($s['headings']['h2']) ? array_slice($s['headings']['h2'],0,10) : [];
              $h3 = isset($s['headings']['h3']) && is_array($s['headings']['h3']) ? array_slice($s['headings']['h3'],0,10) : [];
              $h4 = isset($s['headings']['h4']) && is_array($s['headings']['h4']) ? array_slice($s['headings']['h4'],0,10) : [];
              $parts[] = "#{$i} {$t} ({$u})\nH2:\n- ".implode("\n- ",$h2)."\nH3:\n- ".implode("\n- ",$h3)."\nH4:\n- ".implode("\n- ",$h4);
            }
