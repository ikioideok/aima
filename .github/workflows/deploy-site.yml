name: Deploy corporate site to Sakura (root)

on:
  push:
    branches: [ main ]
    paths:
      - "**"            # ルートサイトの変更で実行
      - "!media/**"     # media は別ワークフロー
      - "!cms-api/**"
      - "!.github/**"
  workflow_dispatch:

concurrency:
  group: deploy-site-root
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      SAKURA_HOST: ${{ secrets.SAKURA_HOST }}
      SAKURA_USER: ${{ secrets.SAKURA_USER }}
      SAKURA_PASSWORD: ${{ secrets.SAKURA_PASSWORD }}
      ROOT_REMOTE_DIR: /home/violetsheep5/www/   # 公開ルート

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Build corporate site (root project)
        env:
          VITE_CMS_API_BASE: ${{ secrets.VITE_CMS_API_BASE }}
          VITE_ADMIN_TOKEN: ${{ secrets.VITE_ADMIN_TOKEN }}
        run: |
          npm ci
          npm run build
          npm run postbuild || true
          mkdir -p dist
          echo "deployed OK $(date -u +'%Y-%m-%dT%H:%M:%SZ')" > dist/health.txt
          echo "---- local dist listing ----"
          find dist -maxdepth 2 -type f -printf "%p\n" | sort

      - name: Guard remote path (/www)
        run: |
          case "${ROOT_REMOTE_DIR}" in
            */www|*/www/) echo "OK: ${ROOT_REMOTE_DIR}" ;;
            *) echo "NG: ROOT_REMOTE_DIR must be .../www/ ; got '${ROOT_REMOTE_DIR}'" && exit 1 ;;
          esac

      - name: Deploy via lftp mirror (dist/ → /www/)
        env:
          LFTP_PASSWORD: ${{ secrets.SAKURA_PASSWORD }}
        run: |
          sudo apt-get update -y >/dev/null && sudo apt-get install -y lftp >/dev/null
          echo "Mirroring ./dist/ -> ${ROOT_REMOTE_DIR}"
          # dist の「中身だけ」を /www/ 直下へ（dist という箱は作らない）
          lftp -u "${SAKURA_USER},${LFTP_PASSWORD}" sftp://"${SAKURA_HOST}" -e \
            "set sftp:auto-confirm yes; mkdir -p ${ROOT_REMOTE_DIR}; mirror -R --only-newer --parallel=2 ./dist/ ${ROOT_REMOTE_DIR}; bye"
          echo "---- remote /www listing ----"
          lftp -u "${SAKURA_USER},${LFTP_PASSWORD}" sftp://"${SAKURA_HOST}" -e \
            "set sftp:auto-confirm yes; cls -l ${ROOT_REMOTE_DIR}; bye"

      - name: Verify (SFTP & HTTP)
        env:
          LFTP_PASSWORD: ${{ secrets.SAKURA_PASSWORD }}
        run: |
          # SFTPで /www/health.txt を取得して実在確認
          lftp -u "${SAKURA_USER},${LFTP_PASSWORD}" sftp://"${SAKURA_HOST}" -e \
            "set sftp:auto-confirm yes; get ${ROOT_REMOTE_DIR}/health.txt -o _health.txt; bye"
          echo "---- remote health.txt ----"
          cat _health.txt
          echo "Waiting for publish (up to ~30s)..."
          for i in {1..6}; do
            code=$(curl -s -o /dev/null -m 10 -w "%{http_code}" "https://violetsheep5.sakura.ne.jp/health.txt")
            echo "try $i: $code"
            [ "$code" = "200" ] && echo "OK" && exit 0
            sleep 5
          done
          echo "NG: still 404"
          exit 1
