services:
  - type: static
    name: aima-media
    env: node
    buildCommand: npm ci && npm run build && npm run postbuild
    publishPath: dist/media
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
